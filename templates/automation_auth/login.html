{% extends "base.html" %}
{% block title %}Sign In — Campus Portal{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;">
<div style="width:100%;max-width:400px;">
  <div style="text-align:center;margin-bottom:28px;">
    <div style="font-size:3rem;">🎓</div>
    <h2 style="font-size:1.5rem;font-weight:800;margin-top:8px;">Welcome Back</h2>
    <p style="color:var(--muted);font-size:0.875rem;margin-top:4px;">Sign in to Campus Complaint Portal</p>
  </div>
  <div class="card" style="padding:28px;">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-group label">Username</label>
        <input class="form-control" type="text" name="username" required autofocus placeholder="Enter your username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" name="password" required placeholder="Enter your password">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;padding:10px;">Sign In</button>
    </form>
    <p style="margin-top:18px;text-align:center;font-size:0.85rem;color:var(--muted);">
      No account? <a href="{% url 'automation_auth:register' %}" style="color:var(--accent);font-weight:600;">Register here</a>
    </p>
  </div>
</div>
</div>
{% endblock %}
