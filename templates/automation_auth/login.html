{% extends "base.html" %}
{% block title %}Login — Campus Portal{% endblock %}
{% block content %}
<div style="max-width:420px;margin:60px auto">
<div class="card">
    <h2 style="margin-bottom:20px;color:#2b6cb0">Sign In</h2>
    <form method="post">
        {% csrf_token %}
        <label>Username</label>
        <input type="text" name="username" required autofocus>
        <label>Password</label>
        <input type="password" name="password" required>
        <button class="btn btn-primary" style="width:100%" type="submit">Login</button>
    </form>
    <p style="margin-top:14px;text-align:center;font-size:0.88rem">
        No account? <a href="{% url 'automation_auth:register' %}">Register here</a>
    </p>
</div>
</div>
{% endblock %}
