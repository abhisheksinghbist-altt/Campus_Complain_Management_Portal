{% extends "base.html" %}
{% block title %}Register — Campus Portal{% endblock %}
{% block content %}
<div style="max-width:480px;margin:40px auto">
<div class="card">
    <h2 style="margin-bottom:20px;color:#2b6cb0">Create Account</h2>
    <form method="post">
        {% csrf_token %}
        <label>First Name</label><input type="text" name="first_name" required>
        <label>Last Name</label><input type="text" name="last_name" required>
        <label>Username</label><input type="text" name="username" required>
        <label>Email</label><input type="email" name="email" required>
        <label>Password</label><input type="password" name="password" required>
        <label>Role</label>
        <select name="role">
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
            <option value="staff">Staff</option>
        </select>
        <label>Department</label><input type="text" name="department" placeholder="e.g. Computer Science">
        <button class="btn btn-primary" style="width:100%" type="submit">Register</button>
    </form>
    <p style="margin-top:14px;text-align:center;font-size:0.88rem">
        Already registered? <a href="{% url 'automation_auth:login' %}">Login</a>
    </p>
</div>
</div>
{% endblock %}
